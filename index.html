<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pixel Cube Gacha</title>
<style>
:root{
  --cyan:#34d8ff;
  --blue:#0a7cff;
  --gold:#ffd64a;
  --bg:#02050b;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 50% 8%,#12315b 0,#07111e 26%,#02050b 64%);
  color:#fff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body{
  min-height:100svh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}
.stage{
  position:relative;
  width:min(100vw,500px);
  height:100svh;
  display:flex;
  justify-content:center;
  align-items:center;
}
.machine{
  position:relative;
  width:min(100%,calc(100svh * .5));
  aspect-ratio:1/2;
  filter:drop-shadow(0 24px 42px rgba(0,0,0,.55));
}
.machine>img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  user-select:none;
  -webkit-user-drag:none;
}

/* 元画像のカプセル部分を隠して、ここを本当に動くHTMLキューブに差し替える */
.dynamicGrid{
  position:absolute;
  left:11.5%;
  top:10.2%;
  width:77%;
  height:42.9%;
  overflow:hidden;
  border-radius:3%;
  background:
    radial-gradient(circle at 50% 35%,rgba(25,80,135,.34),transparent 55%),
    linear-gradient(180deg,rgba(5,15,30,.985),rgba(1,7,17,.99));
  box-shadow:
    inset 0 0 0 1px rgba(148,224,255,.28),
    inset 0 0 24px rgba(19,136,255,.20),
    0 0 15px rgba(26,160,255,.15);
  z-index:3;
}

/* 各キューブは絶対配置。slotを変えると本当に移動する */
.cube{
  position:absolute;
  width:23.1%;
  height:23.1%;
  border-radius:9%;
  background:
    linear-gradient(145deg,rgba(255,255,255,.16),rgba(75,145,210,.04) 46%,rgba(255,255,255,.08));
  border:1px solid rgba(173,231,255,.42);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.08),
    inset 0 0 16px rgba(86,195,255,.10),
    0 0 8px rgba(45,156,255,.10);
  backdrop-filter:blur(2px);
  transition:
    left .21s cubic-bezier(.18,.82,.28,1.08),
    top .21s cubic-bezier(.18,.82,.28,1.08),
    transform .21s ease,
    box-shadow .18s ease,
    filter .18s ease,
    opacity .18s ease;
}
.cube::before{
  content:"";
  position:absolute;
  inset:5%;
  border-radius:8%;
  border:1px solid rgba(255,255,255,.10);
  pointer-events:none;
}
.cube.moving{
  transform:scale(.91) rotate(3deg);
  filter:brightness(1.18);
  z-index:8;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.18),
    0 0 19px rgba(48,192,255,.42);
}
.cube.selected{
  transform:scale(1.07);
  z-index:10;
  box-shadow:
    inset 0 0 0 2px #b8f4ff,
    inset 0 0 24px rgba(44,188,255,.48),
    0 0 34px rgba(24,164,255,.95);
}
.cube.dim{opacity:.34;filter:saturate(.55) brightness(.58)}
.cube.goldCube{
  transform:scale(1.075);
  z-index:11;
  background:
    radial-gradient(circle at 50% 45%,rgba(255,255,255,.32),rgba(255,205,32,.13) 45%,rgba(255,150,0,.03));
  border-color:#fff0a0;
  box-shadow:
    inset 0 0 0 2px #fff0a0,
    inset 0 0 32px rgba(255,196,25,.54),
    0 0 45px rgba(255,169,0,.98);
  animation:goldBreath .55s ease-in-out infinite alternate;
}
@keyframes goldBreath{
  from{filter:brightness(1)}
  to{filter:brightness(1.45)}
}

/* 1キューブ＝1カプセル */
.cap{
  position:absolute;
  left:50%;
  top:50%;
  width:72%;
  aspect-ratio:1;
  transform:translate(-50%,-50%);
  border-radius:50%;
  filter:drop-shadow(0 5px 6px rgba(0,0,0,.42));
}
.capTop,.capBottom{
  position:absolute;
  left:7%;
  width:86%;
  height:42%;
  border:1.5px solid rgba(255,255,255,.58);
  box-shadow:inset 0 0 10px rgba(255,255,255,.18);
}
.capTop{
  top:7%;
  border-radius:999px 999px 12px 12px;
}
.capBottom{
  bottom:7%;
  border-radius:12px 12px 999px 999px;
}
.capBand{
  position:absolute;
  left:6%;
  right:6%;
  top:46%;
  height:8%;
  border-radius:999px;
  background:rgba(255,255,255,.52);
  box-shadow:0 0 7px rgba(255,255,255,.26);
}
.capShine{
  position:absolute;
  left:24%;
  top:17%;
  width:17%;
  height:17%;
  border-radius:50%;
  background:rgba(255,255,255,.76);
  filter:blur(.7px);
}
.cap.gold{
  filter:drop-shadow(0 0 8px #fff1a3) drop-shadow(0 0 18px #ffb300);
}
.cap.gold .capTop,.cap.gold .capBottom{
  background:linear-gradient(135deg,#fff6a8 0%,#ffd84c 28%,#ad6800 63%,#fff0a1 100%)!important;
  border-color:#fff2a4;
}
.cap.gold .capBand{
  background:linear-gradient(90deg,#fff5b3,#c87900,#fff3ad);
}

/* 本体中央の物理ボタン */
.start{
  position:absolute;
  left:50%;
  top:61.3%;
  transform:translate(-50%,-50%);
  width:19%;
  aspect-ratio:1;
  border:0;
  border-radius:50%;
  background:transparent;
  cursor:pointer;
  z-index:12;
  -webkit-tap-highlight-color:transparent;
}
.start::after{
  content:"";
  position:absolute;
  inset:13%;
  border-radius:50%;
  box-shadow:0 0 0 2px rgba(123,235,255,.5),0 0 18px rgba(23,173,255,.55);
  opacity:.5;
  animation:ring 1.15s ease-in-out infinite alternate;
}
.start:active{transform:translate(-50%,-50%) scale(.94)}
.start[disabled]{pointer-events:none}
@keyframes ring{
  to{opacity:1;box-shadow:0 0 0 3px rgba(140,240,255,.82),0 0 31px rgba(36,178,255,.95)}
}

/* 抽選されたカプセルが排出口へ落ちる */
.fly{
  position:absolute;
  width:13.8%;
  aspect-ratio:1;
  left:50%;
  top:35%;
  transform:translate(-50%,-50%);
  opacity:0;
  z-index:15;
  pointer-events:none;
}
.fly .cap{width:100%;height:100%}
.fly.go{
  opacity:1;
  animation:fall 1.1s cubic-bezier(.22,.76,.24,1) forwards;
}
@keyframes fall{
  0%   {top:35%;transform:translate(-50%,-50%) scale(.80) rotate(-9deg)}
  35%  {top:47%;transform:translate(-50%,-50%) scale(.92) rotate(8deg)}
  68%  {top:61%;transform:translate(-50%,-50%) scale(1) rotate(-5deg)}
  100% {top:77%;transform:translate(-50%,-50%) scale(.92) rotate(0)}
}

/* 画面フラッシュ */
.flash,.goldflash{
  position:fixed;
  inset:0;
  opacity:0;
  pointer-events:none;
  z-index:30;
}
.flash{background:#fff}
.goldflash{
  background:radial-gradient(circle at 50% 45%,#fff 0 2%,#ffe878 7%,rgba(255,179,0,.72) 22%,transparent 52%);
}
.flash.go{animation:flash .48s ease-out}
.goldflash.go{animation:goldFlash .9s ease-out}
@keyframes flash{0%{opacity:0}20%{opacity:.92}100%{opacity:0}}
@keyframes goldFlash{0%{opacity:0;transform:scale(.42)}30%{opacity:1}100%{opacity:0;transform:scale(1.45)}}

/* 開封 */
.result{
  position:fixed;
  inset:0;
  z-index:40;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(1,4,10,.82);
  backdrop-filter:blur(8px);
  opacity:0;
  pointer-events:none;
  transition:opacity .22s ease;
}
.result.show{opacity:1;pointer-events:auto}
.resultbox{
  width:min(78vw,330px);
  aspect-ratio:1;
  position:relative;
}
.half{
  position:absolute;
  left:50%;
  width:58%;
  height:29%;
  transform:translateX(-50%);
  border:2px solid rgba(255,255,255,.72);
  box-shadow:0 0 30px currentColor,inset 0 0 18px rgba(255,255,255,.24);
}
.half.top{
  top:34%;
  border-radius:999px 999px 15px 15px;
  background:linear-gradient(145deg,#76e5ff,#0b6cff);
}
.half.bottom{
  top:51%;
  border-radius:15px 15px 999px 999px;
  background:linear-gradient(145deg,#0a56d5,#85e9ff);
}
.result.show .half.top{animation:openTop .82s .12s ease-out forwards}
.result.show .half.bottom{animation:openBottom .82s .12s ease-out forwards}
@keyframes openTop{to{transform:translate(-50%,-86%) rotate(-18deg)}}
@keyframes openBottom{to{transform:translate(-50%,86%) rotate(18deg)}}
.result.gold .half{
  color:#ffd84d;
  border-color:#fff0a0;
}
.result.gold .half.top,.result.gold .half.bottom{
  background:linear-gradient(145deg,#fff6ad,#ffd233 35%,#a25f00 72%,#ffec8a);
}
.prize{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.2);
  width:28%;
  aspect-ratio:1;
  border-radius:18%;
  background:linear-gradient(145deg,#eafcff,#4bc7ff 35%,#5362ff 78%);
  box-shadow:0 0 40px #50d7ff,0 0 80px rgba(94,88,255,.78);
  opacity:0;
}
.result.show .prize{animation:prize .68s .58s ease-out forwards}
.result.gold .prize{
  background:linear-gradient(145deg,#fffbe9,#ffe45a 30%,#cc8100 72%,#fff1a4);
  box-shadow:0 0 45px #fff0a4,0 0 100px #ffab00;
}
@keyframes prize{to{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(45deg)}}
.resultText{
  position:absolute;
  left:50%;
  bottom:3%;
  transform:translateX(-50%);
  font-weight:900;
  letter-spacing:.12em;
  font-size:clamp(18px,5vw,28px);
  white-space:nowrap;
  text-shadow:0 0 20px currentColor;
}
.result.gold .resultText{color:#ffe16a}
.closeHint{
  position:absolute;
  left:50%;
  bottom:-8%;
  transform:translateX(-50%);
  color:#aab7cd;
  font-size:11px;
  white-space:nowrap;
}

/* テスト確認用 */
.testPanel{
  position:fixed;
  top:max(10px,env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);
  z-index:50;
  display:flex;
  gap:6px;
  padding:6px;
  background:rgba(0,0,0,.58);
  border:1px solid rgba(255,255,255,.13);
  border-radius:999px;
  backdrop-filter:blur(9px);
}
.testPanel button{
  border:0;
  border-radius:999px;
  padding:7px 12px;
  background:#172033;
  color:#fff;
  font-size:11px;
  font-weight:800;
}
.testPanel button.active{background:#0a7cff}
</style>
</head>
<body>

<div class="stage">
  <div class="machine" id="machine">
    <img src="gacha-machine.png" alt="ガチャマシーン">

    <div class="dynamicGrid" id="dynamicGrid"></div>

    <button id="startBtn" class="start" aria-label="ガチャを回す"></button>

    <div class="fly" id="fly"></div>
  </div>
</div>

<div class="flash" id="flash"></div>
<div class="goldflash" id="goldflash"></div>

<div class="result" id="result">
  <div class="resultbox">
    <div class="half top"></div>
    <div class="half bottom"></div>
    <div class="prize"></div>
    <div class="resultText" id="resultText">RESULT</div>
    <div class="closeHint">タップで戻る</div>
  </div>
</div>

<div class="testPanel" id="testPanel">
  <button data-mode="random" class="active">ランダム</button>
  <button data-mode="normal">通常</button>
  <button data-mode="jackpot">確定</button>
</div>

<script>
const CONFIG={
  DEMO_JACKPOT_RATE:0.05,
  SHOW_TEST_PANEL:true,
  TEST_MODE:"random"
};

async function getGachaResult(){
  if(CONFIG.TEST_MODE==="jackpot") return {jackpot:true};
  if(CONFIG.TEST_MODE==="normal")  return {jackpot:false};
  return {jackpot:Math.random()<CONFIG.DEMO_JACKPOT_RATE};
}

const colors=[
  ["#ff4264","#990018"],
  ["#3198ff","#0044a6"],
  ["#2fe493","#00753f"],
  ["#bd62ff","#6415a1"],
  ["#31dcf8","#007c9e"],
  ["#ffc946","#a35e00"],
  ["#ff66ca","#9f176b"],
  ["#ff7c33","#a93300"],
  ["#a95fff","#56169b"],
  ["#278cff","#003c9c"],
  ["#ff4545","#940000"],
  ["#42d8f6","#007b96"],
  ["#e8cf55","#958000"],
  ["#35dc78","#00753b"],
  ["#d788ff","#7e35a6"],
  ["#3398ff","#00459b"]
];

const dynamicGrid=document.getElementById("dynamicGrid");
const startBtn=document.getElementById("startBtn");
const fly=document.getElementById("fly");
const flash=document.getElementById("flash");
const goldflash=document.getElementById("goldflash");
const result=document.getElementById("result");
const resultText=document.getElementById("resultText");
const testPanel=document.getElementById("testPanel");

let cubes=[];
let busy=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function capMarkup(pair,gold=false){
  const [a,b]=pair;
  return `
    <div class="cap ${gold?"gold":""}">
      <div class="capTop" style="background:linear-gradient(145deg,${a},${b})"></div>
      <div class="capBottom" style="background:linear-gradient(145deg,${b},${a})"></div>
      <div class="capBand"></div>
      <div class="capShine"></div>
    </div>
  `;
}

function setPos(cube,slot){
  const row=Math.floor(slot/4);
  const col=slot%4;
  const x=[1.1,26.4,51.7,77.0][col];
  const y=[1.2,26.4,51.6,76.8][row];
  cube.style.left=x+"%";
  cube.style.top=y+"%";
  cube.dataset.slot=slot;
}

function buildGrid(){
  dynamicGrid.innerHTML="";
  cubes=[];
  for(let i=0;i<16;i++){
    const cube=document.createElement("div");
    cube.className="cube";
    cube.dataset.color=i;
    cube.innerHTML=capMarkup(colors[i]);
    setPos(cube,i);
    dynamicGrid.appendChild(cube);
    cubes.push(cube);
  }
}
buildGrid();

if(!CONFIG.SHOW_TEST_PANEL){
  testPanel.style.display="none";
}

testPanel.addEventListener("click",e=>{
  const btn=e.target.closest("button");
  if(!btn)return;
  CONFIG.TEST_MODE=btn.dataset.mode;
  testPanel.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
});

/* 隣接マス同士を入れ替えるので、本当にキューブがスライドする */
function neighbors(slot){
  const r=Math.floor(slot/4);
  const c=slot%4;
  const n=[];
  if(r>0)n.push(slot-4);
  if(r<3)n.push(slot+4);
  if(c>0)n.push(slot-1);
  if(c<3)n.push(slot+1);
  return n;
}

function cubeAt(slot){
  return cubes.find(c=>Number(c.dataset.slot)===slot);
}

async function swapSlots(a,b){
  const ca=cubeAt(a);
  const cb=cubeAt(b);
  if(!ca||!cb)return;

  ca.classList.add("moving");
  cb.classList.add("moving");

  setPos(ca,b);
  setPos(cb,a);

  await sleep(220);

  ca.classList.remove("moving");
  cb.classList.remove("moving");
}

async function shuffleCubes(){
  /* 点滅ではなく、キューブそのものを約2.7秒間シャッフル */
  let current=Math.floor(Math.random()*16);

  for(let i=0;i<13;i++){
    const ns=neighbors(current);
    const next=ns[Math.floor(Math.random()*ns.length)];
    await swapSlots(current,next);
    current=next;
  }

  /* 最後に2組ずつ動かしてスピード感 */
  for(let r=0;r<3;r++){
    const a=Math.floor(Math.random()*16);
    const ns=neighbors(a);
    const b=ns[Math.floor(Math.random()*ns.length)];
    await swapSlots(a,b);
  }
}

function clearState(){
  cubes.forEach(c=>c.classList.remove("selected","goldCube","dim","moving"));
}

async function chooseCube(){
  clearState();

  /* 現在の位置から抽選対象を選ぶ */
  const target=cubes[Math.floor(Math.random()*cubes.length)];

  /* 一瞬だけ2〜3個を迷う演出。点滅連打はしない */
  const decoys=[...cubes]
    .sort(()=>Math.random()-.5)
    .filter(c=>c!==target)
    .slice(0,2);

  for(const d of decoys){
    d.classList.add("selected");
    await sleep(230);
    d.classList.remove("selected");
  }

  target.classList.add("selected");
  await sleep(520);

  return target;
}

function doFlash(gold=false){
  const el=gold?goldflash:flash;
  el.classList.remove("go");
  void el.offsetWidth;
  el.classList.add("go");
}

async function jackpotChange(target){
  cubes.forEach(c=>{
    if(c!==target)c.classList.add("dim");
  });

  await sleep(320);

  target.classList.remove("selected");
  target.classList.add("goldCube");
  target.innerHTML=capMarkup(colors[Number(target.dataset.color)],true);

  doFlash(true);
  await sleep(650);
}

async function fallCapsule(target,jackpot){
  const color=colors[Number(target.dataset.color)];
  fly.className="fly";
  fly.innerHTML=capMarkup(color,jackpot);

  const cap=target.querySelector(".cap");
  if(cap)cap.style.opacity="0";

  void fly.offsetWidth;
  fly.classList.add("go");

  await sleep(1140);
}

async function showResult(jackpot){
  doFlash(jackpot);
  await sleep(210);

  result.className=jackpot?"result gold show":"result show";
  resultText.textContent=jackpot?"JACKPOT":"RESULT";
}

async function runGacha(){
  if(busy)return;

  busy=true;
  startBtn.disabled=true;
  result.className="result";
  fly.className="fly";
  clearState();

  /* 毎回元の並びに戻さず、前回の並びから続けて動く */
  const serverResult=await getGachaResult();

  await shuffleCubes();
  const target=await chooseCube();

  if(serverResult.jackpot){
    await jackpotChange(target);
  }

  await fallCapsule(target,serverResult.jackpot);
  await showResult(serverResult.jackpot);

  busy=false;
  startBtn.disabled=false;
}

startBtn.addEventListener("click",runGacha);

result.addEventListener("click",()=>{
  result.className="result";
  fly.className="fly";
  clearState();

  /* 消したカプセルを全て戻す */
  cubes.forEach(c=>{
    c.innerHTML=capMarkup(colors[Number(c.dataset.color)],false);
    c.style.opacity="";
  });
});
</script>
</body>
</html>
