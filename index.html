<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>Pixel Cube Gacha</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:#02050b;
}

body{
  min-height:100svh;
  overflow:hidden;

  display:flex;
  justify-content:center;
  align-items:center;

  font-family:
  system-ui,
  -apple-system,
  sans-serif;
}


/* ==============================
   全体
============================== */

.stage{

  width:min(
    100vw,
    500px
  );

  height:100svh;

  display:flex;
  justify-content:center;
  align-items:center;

  position:relative;

}


.machine{

  position:relative;

  width:min(
    100%,
    calc(100svh * .5)
  );

  aspect-ratio:1 / 2;

}


.machineImage{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:contain;

  display:block;

  user-select:none;

  pointer-events:none;

}


/* ==============================
   元画像の4×4部分
============================== */

.grid{

  position:absolute;

  left:11.5%;
  top:10.2%;

  width:77%;
  height:42.8%;

  overflow:hidden;

  z-index:5;

  background:#06101d;

}


/* 1つの画像キューブ */

.tile{

  position:absolute;

  left:0;
  top:0;

  overflow:hidden;

  will-change:transform;

  transition:
    transform
    .30s
    cubic-bezier(
      .18,
      .82,
      .22,
      1.05
    ),

    filter
    .18s,

    box-shadow
    .18s,

    opacity
    .18s;

}


/* キューブ内部の元画像 */

.tile img{

  position:absolute;

  max-width:none;

  pointer-events:none;

  user-select:none;

}


/* 移動中 */

.tile.moving{

  z-index:20;

  filter:
    brightness(1.18);

  box-shadow:

    0 0 16px
    rgba(40,190,255,.45);

}


/* 抽選候補 */

.tile.selected{

  z-index:25;

  filter:
    brightness(1.4);

  box-shadow:

    inset 0 0 0 3px
    rgba(210,248,255,.96),

    0 0 30px
    rgba(40,190,255,.95);

}


/* 大当たり時の周囲 */

.tile.dim{

  opacity:.35;

  filter:
    brightness(.55)
    saturate(.65);

}


/* 大当たりキューブ */

.tile.jackpot{

  z-index:30;

  filter:
    brightness(1.45);

  box-shadow:

    inset 0 0 0 3px
    #fff1a1,

    0 0 40px
    #ffb300,

    0 0 70px
    rgba(255,175,0,.65);

}


/* ==============================
   ゴールドカプセル
============================== */

.goldCapsule{

  display:none;

  position:absolute;

  left:50%;
  top:50%;

  width:62%;

  aspect-ratio:1;

  transform:
    translate(
      -50%,
      -50%
    );

  border-radius:50%;

  z-index:40;

  filter:

    drop-shadow(
      0 0 8px
      #fff4a0
    )

    drop-shadow(
      0 0 22px
      #ffb000
    );

}


.tile.jackpot
.goldCapsule{

  display:block;

}


.goldTop,
.goldBottom{

  position:absolute;

  left:6%;

  width:88%;
  height:43%;

  border:
    2px solid
    #fff1a0;

  background:

    linear-gradient(

      135deg,

      #fff9c4 0%,

      #ffd53d 26%,

      #a86400 62%,

      #ffe979 100%

    );

}


.goldTop{

  top:6%;

  border-radius:
    999px
    999px
    14px
    14px;

}


.goldBottom{

  bottom:6%;

  border-radius:
    14px
    14px
    999px
    999px;

}


.goldBand{

  position:absolute;

  left:5%;
  right:5%;

  top:46%;

  height:8%;

  border-radius:999px;

  background:

    linear-gradient(

      90deg,

      #fff5ad,

      #b97100,

      #fff5ad

    );

}


/* ==============================
   中央ボタン
============================== */

.pushButton{

  position:absolute;

  left:50%;
  top:61.25%;

  width:19%;

  aspect-ratio:1;

  transform:

    translate(
      -50%,
      -50%
    );

  border:0;

  border-radius:50%;

  background:
    transparent;

  z-index:50;

  cursor:pointer;

}


/* 押した時だけ沈む */

.pushButton::before{

  content:"";

  position:absolute;

  inset:8%;

  border-radius:50%;

  opacity:0;

  transition:
    .10s;

  background:

    radial-gradient(

      circle,

      rgba(
        160,
        238,
        255,
        .24
      ),

      rgba(
        0,
        100,
        255,
        .10
      ) 50%,

      transparent 72%

    );

  box-shadow:

    inset 0 0 20px
    rgba(
      20,
      80,
      180,
      .85
    );

}


.pushButton.pressed{

  transform:

    translate(
      -50%,
      -50%
    )

    scale(.92);

}


.pushButton.pressed::before{

  opacity:1;

}


/* 抽選処理中 */

.pushButton.processing::after{

  content:"";

  position:absolute;

  inset:0%;

  border-radius:50%;

  border:

    4px solid

    rgba(
      100,
      225,
      255,
      .20
    );

  border-top-color:
    #89efff;

  border-right-color:
    #168cff;

  animation:

    rotateRing
    .75s
    linear
    infinite;

}


@keyframes rotateRing{

  to{

    transform:
      rotate(360deg);

  }

}


/* ==============================
   カプセル移動
============================== */

.traveler{

  position:fixed;

  z-index:100;

  pointer-events:none;

  opacity:0;

  border-radius:50%;

}


/* 通常カプセル */

.normalCapsule{

  position:absolute;

  inset:0;

  border-radius:50%;

}


.normalTop,
.normalBottom{

  position:absolute;

  left:6%;

  width:88%;
  height:43%;

  border:

    2px solid

    rgba(
      255,
      255,
      255,
      .70
    );

}


.normalTop{

  top:6%;

  border-radius:

    999px
    999px
    13px
    13px;

}


.normalBottom{

  bottom:6%;

  border-radius:

    13px
    13px
    999px
    999px;

}


.normalBand{

  position:absolute;

  left:5%;
  right:5%;

  top:46%;

  height:8%;

  border-radius:999px;

  background:

    rgba(
      255,
      255,
      255,
      .70
    );

}


/* ==============================
   排出口
============================== */

.chute{

  position:absolute;

  left:36.6%;
  top:70.7%;

  width:26.8%;
  height:13.8%;

  z-index:60;

  overflow:hidden;

  pointer-events:none;

}


/* 排出口から出るカプセル */

.chuteCapsule{

  position:absolute;

  left:50%;

  top:-45%;

  width:54%;

  aspect-ratio:1;

  transform:

    translate(
      -50%,
      -50%
    )

    scale(.72);

  opacity:0;

  border-radius:50%;

}


.chuteCapsule.out{

  animation:

    capsuleOut
    .82s
    cubic-bezier(
      .18,
      .82,
      .24,
      1.12
    )
    forwards;

}


@keyframes capsuleOut{

  0%{

    top:-30%;

    opacity:0;

    transform:

      translate(
        -50%,
        -50%
      )

      scale(.70)

      rotate(-12deg);

  }


  15%{

    opacity:1;

  }


  62%{

    top:50%;

    opacity:1;

    transform:

      translate(
        -50%,
        -50%
      )

      scale(.94)

      rotate(9deg);

  }


  82%{

    top:68%;

    transform:

      translate(
        -50%,
        -50%
      )

      scale(1.02)

      rotate(-3deg);

  }


  100%{

    top:64%;

    opacity:1;

    transform:

      translate(
        -50%,
        -50%
      )

      scale(.98)

      rotate(0deg);

  }

}


/* ==============================
   フラッシュ
============================== */

.flash{

  position:fixed;

  inset:0;

  z-index:200;

  opacity:0;

  pointer-events:none;

  background:#fff;

}


.flash.go{

  animation:

    whiteFlash
    .50s
    ease-out;

}


@keyframes whiteFlash{

  0%{
    opacity:0;
  }

  20%{
    opacity:.9;
  }

  100%{
    opacity:0;
  }

}


/* 金演出 */

.goldFlash{

  position:fixed;

  inset:0;

  z-index:201;

  opacity:0;

  pointer-events:none;

  background:

    radial-gradient(

      circle at center,

      #ffffff
      0 2%,

      #fff092
      6%,

      rgba(
        255,
        180,
        0,
        .60
      )
      22%,

      transparent
      55%

    );

}


.goldFlash.go{

  animation:

    goldFlashAnim
    .85s
    ease-out;

}


@keyframes goldFlashAnim{

  0%{

    opacity:0;

    transform:
      scale(.5);

  }

  28%{

    opacity:1;

  }

  100%{

    opacity:0;

    transform:
      scale(1.4);

  }

}


/* ==============================
   動作確認用モード
============================== */

.modePanel{

  position:fixed;

  top:max(
    8px,
    env(
      safe-area-inset-top
    )
  );

  left:50%;

  transform:
    translateX(-50%);

  z-index:300;

  display:flex;

  gap:6px;

  padding:6px;

  border-radius:999px;

  background:
    rgba(
      0,
      0,
      0,
      .72
    );

  border:

    1px solid

    rgba(
      255,
      255,
      255,
      .16
    );

}


.modePanel button{

  border:0;

  border-radius:999px;

  padding:
    8px
    14px;

  background:#172033;

  color:#fff;

  font-weight:800;

  font-size:12px;

}


.modePanel button.active{

  background:#087cff;

}

</style>
</head>


<body>


<div class="stage">


  <div
    class="machine"
    id="machine"
  >


    <img

      id="machineImage"

      class="machineImage"

      src="gacha-machine.png"

      alt="ガチャマシーン"

    >


    <div
      class="grid"
      id="grid"
    >
    </div>


    <button

      id="pushButton"

      class="pushButton"

      aria-label="ガチャを回す"

    >
    </button>


    <div
      class="chute"
      id="chute"
    >

      <div
        class="chuteCapsule"
        id="chuteCapsule"
      >
      </div>

    </div>


  </div>


</div>



<div
  class="flash"
  id="flash"
>
</div>


<div
  class="goldFlash"
  id="goldFlash"
>
</div>



<div
  class="modePanel"
  id="modePanel"
>

  <button
    data-mode="normal"
  >
    通常
  </button>

  <button
    data-mode="random"
    class="active"
  >
    ランダム
  </button>

  <button
    data-mode="jackpot"
  >
    確定
  </button>

</div>



<script>


let mode =
"random";


let busy =
false;


const JACKPOT_RATE =
0.08;


const sleep =
ms =>
new Promise(

  resolve =>
  setTimeout(
    resolve,
    ms
  )

);


const machine =
document.getElementById(
  "machine"
);


const machineImage =
document.getElementById(
  "machineImage"
);


const grid =
document.getElementById(
  "grid"
);


const pushButton =
document.getElementById(
  "pushButton"
);


const chuteCapsule =
document.getElementById(
  "chuteCapsule"
);


const flash =
document.getElementById(
  "flash"
);


const goldFlash =
document.getElementById(
  "goldFlash"
);


const modePanel =
document.getElementById(
  "modePanel"
);



let tiles = [];



const capsuleColors = [

  ["#ff3857","#920018"],

  ["#278aff","#0040a0"],

  ["#27d980","#006b3b"],

  ["#a64eff","#54118b"],

  ["#24cde8","#00738a"],

  ["#e5bd2e","#8f6c00"],

  ["#ee53b9","#97135e"],

  ["#ef6924","#9d2c00"],

  ["#9848e7","#56108c"],

  ["#227fff","#003a95"],

  ["#ed3838","#930000"],

  ["#25c9e2","#006d87"],

  ["#d3b124","#8c7300"],

  ["#28c96d","#006b35"],

  ["#bf69dc","#77368e"],

  ["#2582e9","#003b8c"]

];



function normalCapsuleHTML(
  index
){

  const color =
  capsuleColors[
    index %
    capsuleColors.length
  ];


  return `

  <div class="normalCapsule">

    <div

      class="normalTop"

      style="

        background:

        linear-gradient(

          145deg,

          ${color[0]},

          ${color[1]}

        );

      "

    >
    </div>


    <div

      class="normalBottom"

      style="

        background:

        linear-gradient(

          145deg,

          ${color[1]},

          ${color[0]}

        );

      "

    >
    </div>


    <div
      class="normalBand"
    >
    </div>

  </div>

  `;

}



function goldCapsuleHTML(){

  return `

  <div class="goldCapsule">

    <div
      class="goldTop"
    >
    </div>

    <div
      class="goldBottom"
    >
    </div>

    <div
      class="goldBand"
    >
    </div>

  </div>

  `;

}



function buildTiles(){


  grid.innerHTML =
  "";


  tiles =
  [];


  const machineWidth =
  machine.clientWidth;


  const machineHeight =
  machine.clientHeight;


  const gridLeft =
  grid.offsetLeft;


  const gridTop =
  grid.offsetTop;


  const gridWidth =
  grid.clientWidth;


  const gridHeight =
  grid.clientHeight;


  const tileWidth =
  gridWidth / 4;


  const tileHeight =
  gridHeight / 4;



  for(
    let i = 0;
    i < 16;
    i++
  ){


    const row =
    Math.floor(
      i / 4
    );


    const col =
    i % 4;



    const tile =
    document.createElement(
      "div"
    );


    tile.className =
    "tile";


    tile.dataset.source =
    i;


    tile.dataset.slot =
    i;


    tile.style.width =
    tileWidth + "px";


    tile.style.height =
    tileHeight + "px";


    tile.style.transform =

    `translate3d(

      ${col * tileWidth}px,

      ${row * tileHeight}px,

      0

    )`;



    const cropImage =
    document.createElement(
      "img"
    );


    cropImage.src =
    "gacha-machine.png";


    cropImage.style.width =
    machineWidth + "px";


    cropImage.style.height =
    machineHeight + "px";


    cropImage.style.left =

    -(

      gridLeft +

      col *
      tileWidth

    ) + "px";


    cropImage.style.top =

    -(

      gridTop +

      row *
      tileHeight

    ) + "px";


    tile.appendChild(
      cropImage
    );


    tile.insertAdjacentHTML(

      "beforeend",

      goldCapsuleHTML()

    );


    grid.appendChild(
      tile
    );


    tiles.push(
      tile
    );

  }

}



function rebuild(){

  buildTiles();

}


if(
  machineImage.complete
){

  setTimeout(
    rebuild,
    50
  );

}else{

  machineImage.addEventListener(

    "load",

    rebuild

  );

}


window.addEventListener(

  "resize",

  () => {

    if(!busy){

      rebuild();

    }

  }

);



function tileAt(
  slot
){

  return tiles.find(

    tile =>

    Number(
      tile.dataset.slot
    ) === slot

  );

}



function slotXY(
  slot
){

  const w =
  grid.clientWidth / 4;


  const h =
  grid.clientHeight / 4;


  return {

    x:

    (
      slot %
      4
    ) * w,

    y:

    Math.floor(
      slot / 4
    ) * h

  };

}



function neighbours(
  slot
){

  const r =
  Math.floor(
    slot / 4
  );


  const c =
  slot % 4;


  const result =
  [];


  if(r > 0){

    result.push(
      slot - 4
    );

  }


  if(r < 3){

    result.push(
      slot + 4
    );

  }


  if(c > 0){

    result.push(
      slot - 1
    );

  }


  if(c < 3){

    result.push(
      slot + 1
    );

  }


  return result;

}



async function swapTiles(
  slotA,
  slotB
){

  const a =
  tileAt(
    slotA
  );


  const b =
  tileAt(
    slotB
  );


  if(
    !a ||
    !b
  ){

    return;

  }


  const posA =
  slotXY(
    slotA
  );


  const posB =
  slotXY(
    slotB
  );


  a.classList.add(
    "moving"
  );


  b.classList.add(
    "moving"
  );


  a.style.transform =

  `translate3d(

    ${posB.x}px,

    ${posB.y}px,

    0

  )`;


  b.style.transform =

  `translate3d(

    ${posA.x}px,

    ${posA.y}px,

    0

  )`;


  a.dataset.slot =
  slotB;


  b.dataset.slot =
  slotA;


  await sleep(
    310
  );


  a.classList.remove(
    "moving"
  );


  b.classList.remove(
    "moving"
  );

}



async function shuffleTiles(){

  let current =

  Math.floor(
    Math.random() *
    16
  );


  for(
    let i = 0;
    i < 12;
    i++
  ){


    const near =
    neighbours(
      current
    );


    const next =

    near[

      Math.floor(

        Math.random() *

        near.length

      )

    ];


    await swapTiles(

      current,

      next

    );


    current =
    next;

  }

}



async function chooseTile(){


  const target =

  tiles[

    Math.floor(

      Math.random() *

      tiles.length

    )

  ];


  const decoys =

  [...tiles]

  .filter(

    tile =>
    tile !== target

  )

  .sort(

    () =>
    Math.random() -
    .5

  )

  .slice(
    0,
    2
  );



  for(
    const tile
    of decoys
  ){


    tile.classList.add(
      "selected"
    );


    await sleep(
      220
    );


    tile.classList.remove(
      "selected"
    );

  }


  target.classList.add(
    "selected"
  );


  await sleep(
    500
  );


  return target;

}



async function jackpotEffect(
  target
){


  tiles.forEach(

    tile => {

      if(
        tile !== target
      ){

        tile.classList.add(
          "dim"
        );

      }

    }

  );


  await sleep(
    280
  );


  target.classList.remove(
    "selected"
  );


  target.classList.add(
    "jackpot"
  );


  goldFlash.classList.remove(
    "go"
  );


  void goldFlash.offsetWidth;


  goldFlash.classList.add(
    "go"
  );


  await sleep(
    700
  );

}



async function internalTransfer(
  target,
  jackpot
){


  const rect =
  target.getBoundingClientRect();


  const machineRect =
  machine.getBoundingClientRect();



  const traveler =
  document.createElement(
    "div"
  );


  traveler.className =
  "traveler";


  traveler.style.width =
  rect.width * .60 +
  "px";


  traveler.style.height =
  rect.width * .60 +
  "px";


  traveler.style.left =

  (
    rect.left +
    rect.width *
    .20
  ) + "px";


  traveler.style.top =

  (
    rect.top +
    rect.height *
    .20
  ) + "px";


  if(jackpot){

    traveler.innerHTML =

    `

    <div
      class="goldCapsule"
      style="
        display:block;
        width:100%;
      "
    >

      <div
        class="goldTop"
      >
      </div>

      <div
        class="goldBottom"
      >
      </div>

      <div
        class="goldBand"
      >
      </div>

    </div>

    `;

  }else{

    traveler.innerHTML =

    normalCapsuleHTML(

      Number(
        target.dataset.source
      )

    );

  }


  document.body.appendChild(
    traveler
  );


  traveler.style.opacity =
  "1";


  const buttonX =

  machineRect.left +

  machineRect.width *
  .50;


  const buttonY =

  machineRect.top +

  machineRect.height *
  .61;


  const animation =

  traveler.animate(

    [

      {

        left:

        traveler.style.left,

        top:

        traveler.style.top,

        opacity:1,

        transform:
        "scale(1)"

      },


      {

        left:

        (
          buttonX -
          rect.width *
          .30
        ) + "px",

        top:

        (
          buttonY -
          rect.width *
          .80
        ) + "px",

        opacity:1,

        transform:
        "scale(.78)",

        offset:.70

      },


      {

        left:

        (
          buttonX -
          rect.width *
          .20
        ) + "px",

        top:

        buttonY + "px",

        opacity:0,

        transform:
        "scale(.35)"

      }

    ],

    {

      duration:800,

      easing:
      "cubic-bezier(.22,.76,.24,1)",

      fill:"forwards"

    }

  );


  await animation.finished;


  traveler.remove();

}



async function releaseFromChute(
  target,
  jackpot
){


  chuteCapsule.className =
  "chuteCapsule";


  if(jackpot){

    chuteCapsule.innerHTML =

    `

    <div
      class="goldCapsule"
      style="
        display:block;
        width:100%;
      "
    >

      <div
        class="goldTop"
      >
      </div>

      <div
        class="goldBottom"
      >
      </div>

      <div
        class="goldBand"
      >
      </div>

    </div>

    `;

  }else{

    chuteCapsule.innerHTML =

    normalCapsuleHTML(

      Number(
        target.dataset.source
      )

    );

  }


  void chuteCapsule.offsetWidth;


  chuteCapsule.classList.add(
    "out"
  );


  await sleep(
    900
  );

}



async function runGacha(){


  if(busy){

    return;

  }


  busy =
  true;


  pushButton.disabled =
  true;


  chuteCapsule.className =
  "chuteCapsule";


  chuteCapsule.innerHTML =
  "";


  tiles.forEach(

    tile => {

      tile.classList.remove(

        "selected",

        "dim",

        "jackpot"

      );

    }

  );


  pushButton.classList.add(
    "processing"
  );



  await shuffleTiles();



  const target =
  await chooseTile();



  let jackpot =
  false;


  if(
    mode ===
    "jackpot"
  ){

    jackpot =
    true;

  }


  else if(
    mode ===
    "normal"
  ){

    jackpot =
    false;

  }


  else{

    jackpot =

    Math.random() <
    JACKPOT_RATE;

  }



  if(jackpot){

    await jackpotEffect(
      target
    );

  }



  await internalTransfer(

    target,

    jackpot

  );



  await sleep(
    350
  );



  await releaseFromChute(

    target,

    jackpot

  );



  pushButton.classList.remove(
    "processing"
  );


  pushButton.disabled =
  false;


  busy =
  false;

}



pushButton.addEventListener(

  "pointerdown",

  () => {

    if(!busy){

      pushButton.classList.add(
        "pressed"
      );

    }

  }

);


pushButton.addEventListener(

  "pointerup",

  () => {

    pushButton.classList.remove(
      "pressed"
    );

  }

);


pushButton.addEventListener(

  "pointercancel",

  () => {

    pushButton.classList.remove(
      "pressed"
    );

  }

);


pushButton.addEventListener(

  "click",

  runGacha

);



modePanel.addEventListener(

  "click",

  event => {


    const button =

    event.target.closest(
      "button"
    );


    if(!button){

      return;

    }


    mode =
    button.dataset.mode;


    modePanel

    .querySelectorAll(
      "button"
    )

    .forEach(

      item => {

        item.classList.remove(
          "active"
        );

      }

    );


    button.classList.add(
      "active"
    );

  }

);

</script>
