<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pixel Cube Gacha V15</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:radial-gradient(circle at 50% 18%,#102750 0,#06101f 28%,#02050b 68%);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body{display:flex;align-items:center;justify-content:center;min-height:100svh}
.stage{width:min(100vw,520px);height:100svh;display:flex;align-items:center;justify-content:center}
.machine{
  position:relative;
  width:min(100%,calc(100svh * .5628));
  aspect-ratio:941/1672;
  filter:drop-shadow(0 24px 42px rgba(0,0,0,.55));
}
.machine-base{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;pointer-events:none;user-select:none;
}

/* ===== 4×4 ===== */
.grid{
  position:absolute;
  left:12.55%;
  top:8.20%;
  width:74.90%;
  height:42.15%;
  z-index:10;
  overflow:visible;
}
.unit{
  position:absolute;left:0;top:0;
  transition:
    transform .56s cubic-bezier(.16,.84,.24,1.04),
    filter .24s ease,
    opacity .22s ease;
  will-change:transform;
  transform-origin:center;
}
.unit.moving{
  z-index:30;
  filter:brightness(1.14) drop-shadow(0 0 12px rgba(68,201,255,.55));
}
.unit.selected{
  z-index:36;
  filter:brightness(1.28) drop-shadow(0 0 10px rgba(180,244,255,.92)) drop-shadow(0 0 20px rgba(33,169,255,.8));
}
.unit.dim{opacity:.24;filter:brightness(.52) saturate(.58)}
.unit.gold-unit{filter:drop-shadow(0 0 10px rgba(255,205,70,.42))}
.unit.jackpot{z-index:42;animation:goldPulse .48s ease-in-out infinite alternate}
@keyframes goldPulse{
  from{filter:brightness(1.05) drop-shadow(0 0 10px rgba(255,205,70,.55))}
  to{filter:brightness(1.3) drop-shadow(0 0 18px rgba(255,236,150,.95)) drop-shadow(0 0 34px rgba(255,172,0,.95))}
}
.unit-cube{
  position:absolute;
  left:-15%;top:-15%;width:130%;height:130%;
  object-fit:contain;pointer-events:none;user-select:none;
}
.unit-capsule{
  position:absolute;left:24%;top:24%;width:52%;height:52%;
  object-fit:contain;pointer-events:none;user-select:none;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.18));
}
.unit.sink{
  z-index:48;
  transition:transform .66s cubic-bezier(.22,.72,.24,1), opacity .46s ease .12s, filter .25s ease;
  opacity:0;filter:brightness(1.55);
}

/* ===== ボタン ===== */
.button-area{position:absolute;left:40.05%;top:54.15%;width:19.9%;aspect-ratio:1/1;z-index:55}
.button-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
#buttonPressed{opacity:0}
.action-button{position:absolute;inset:0;z-index:5;border:0;border-radius:50%;background:transparent;cursor:pointer}
.button-area.pressed #buttonNormal{opacity:0}
.button-area.pressed #buttonPressed{opacity:1;transform:translateY(2px) scale(.97)}

/* ===== 排出口 ===== */
.chute{position:absolute;left:35.25%;top:71.05%;width:29.5%;height:13.4%;z-index:60;overflow:hidden;pointer-events:none}
.chute-glow{position:absolute;left:-2%;top:-3%;width:104%;height:54%;object-fit:fill;opacity:0}
.chute.active .chute-glow{animation:chuteGlow .9s ease}
@keyframes chuteGlow{0%{opacity:0;transform:scale(.82)}25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.18)}}
.out-capsule{
  position:absolute;left:50%;top:-38%;width:46%;
  transform:translateX(-50%) rotate(-10deg) scale(.72);
  opacity:0;filter:drop-shadow(0 8px 10px rgba(0,0,0,.58));
}
.out-capsule.show{animation:outCapsule 1.02s cubic-bezier(.17,.84,.24,1.14) forwards}
@keyframes outCapsule{
  0%{top:-38%;opacity:0;transform:translateX(-50%) rotate(-12deg) scale(.70)}
  18%{opacity:1}
  55%{top:52%;transform:translateX(-50%) rotate(8deg) scale(.93)}
  78%{top:69%;transform:translateX(-50%) rotate(-3deg) scale(1.03)}
  100%{top:63%;opacity:1;transform:translateX(-50%) rotate(0) scale(.99)}
}

/* ===== カプセルOPEN ===== */
.open-layer{position:fixed;inset:0;z-index:85;display:flex;align-items:center;justify-content:center;background:rgba(1,4,12,.72);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .18s ease}
.open-layer.show{opacity:1}
.open-stage{position:relative;width:min(60vw,300px);aspect-ratio:1/1}
.open-half{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 22px rgba(70,190,255,.55))}
.open-half.top{clip-path:inset(0 0 50% 0)}
.open-half.bottom{clip-path:inset(50% 0 0 0)}
.open-layer.opening .open-half.top{animation:openTop .62s cubic-bezier(.18,.84,.25,1) forwards}
.open-layer.opening .open-half.bottom{animation:openBottom .62s cubic-bezier(.18,.84,.25,1) forwards}
.open-layer.gold .open-half{filter:drop-shadow(0 0 28px rgba(255,210,70,.72))}
@keyframes openTop{to{transform:translateY(-42%) rotate(-12deg) scale(1.02)}}
@keyframes openBottom{to{transform:translateY(42%) rotate(12deg) scale(1.02)}}
.open-burst{
  position:absolute;inset:-45%;
  background:radial-gradient(circle,#ffffff 0 8%,rgba(255,255,255,.98) 18%,rgba(170,233,255,.72) 34%,rgba(111,189,255,.22) 52%,transparent 68%);
  border-radius:50%;opacity:0;transform:scale(.2);
}
.open-layer.opening .open-burst{animation:burstPop .42s .18s ease-out forwards}
.open-layer.gold .open-burst{background:radial-gradient(circle,#fffef0 0 8%,rgba(255,250,203,.98) 18%,rgba(255,220,110,.78) 34%,rgba(255,177,0,.28) 52%,transparent 68%)}
@keyframes burstPop{to{opacity:1;transform:scale(1.22)}}

/* ===== 最終フラッシュ ===== */
.flash{position:fixed;inset:0;opacity:0;pointer-events:none;z-index:100}
#whiteFlash{background:#ffffff}
#goldFlash{background:linear-gradient(180deg,rgba(255,253,230,1) 0%,rgba(255,240,176,1) 30%,rgba(255,207,74,1) 65%,rgba(255,173,24,1) 100%)}
#whiteFlash.go{animation:whiteFlash .9s ease-out}
#goldFlash.go{animation:goldFlash 1.05s ease-out}
@keyframes whiteFlash{0%{opacity:0}18%{opacity:1}62%{opacity:1}100%{opacity:0}}
@keyframes goldFlash{0%{opacity:0}18%{opacity:1}64%{opacity:1}100%{opacity:0}}

/* ===== テストUI ===== */
.mode-panel{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;z-index:120;border-radius:999px;background:rgba(0,0,0,.66);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(8px)}
.mode-panel button{border:0;border-radius:999px;padding:8px 14px;background:#172033;color:#fff;font-size:12px;font-weight:800}
.mode-panel button.active{background:#087cff}
.version{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);z-index:120;color:#84dcff;background:rgba(0,0,0,.5);border-radius:999px;padding:4px 9px;font-size:10px;white-space:nowrap}
</style>
</head>
<body>
<div class="stage">
  <div class="machine" id="machine">
    <div class="scan-light" id="scanLight"></div>
    <img class="machine-base" src="machine-base.png" alt="ガチャマシーン">
    <div class="grid" id="grid"></div>
    <div class="button-area" id="buttonArea">
      <img id="buttonNormal" class="button-img" src="button.png" alt="">
      <img id="buttonPressed" class="button-img" src="button-pressed.png" alt="">
      <button id="actionButton" class="action-button" aria-label="ガチャを回す"></button>
    </div>
    <div class="chute" id="chute">
      <img class="chute-glow" src="chute-glow.png" alt="">
      <img id="outCapsule" class="out-capsule" src="capsule.png" alt="">
    </div>
  </div>
</div>
<div class="open-layer" id="openLayer">
  <div class="open-stage">
    <img id="openTop" class="open-half top" src="capsule.png" alt="">
    <img id="openBottom" class="open-half bottom" src="capsule.png" alt="">
    <div class="open-burst"></div>
  </div>
</div>
<div class="flash" id="whiteFlash"></div>
<div class="flash" id="goldFlash"></div>
<script>
(() => {
  const grid = document.getElementById("grid");
  const machine = document.getElementById("machine");
  const scanLight = document.getElementById("scanLight");

  /* 音源はDOM順に依存させず、JS側で直接生成 */
  const sfxButton = new Audio("button.mp3");
  const sfxMachine = new Audio("machine.mp3");
  const sfxRiser = new Audio("riser.mp3");
  const sfxImpact = new Audio("impact.mp3");
  const sfxJackpot = new Audio("jackpot.mp3");

  [sfxButton,sfxMachine,sfxRiser,sfxImpact,sfxJackpot].forEach(audio => {
    audio.preload = "auto";
    audio.playsInline = true;
    audio.load();
  });

  sfxMachine.loop = true;
  const buttonArea = document.getElementById("buttonArea");
  const actionButton = document.getElementById("actionButton");
  const chute = document.getElementById("chute");
  const outCapsule = document.getElementById("outCapsule");
  const openLayer = document.getElementById("openLayer");
  const openTop = document.getElementById("openTop");
  const openBottom = document.getElementById("openBottom");
  const whiteFlash = document.getElementById("whiteFlash");
  const goldFlash = document.getElementById("goldFlash");

  let units = [];
  let busy = false;
  const params = new URLSearchParams(location.search);
  const mode = params.get("mode") || "random";
  let goldUnit = null;

  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));


  function playSfx(audio, volume=1, restart=true, rate=1){
    if(!audio) return;
    try{
      audio.volume = Math.max(0,Math.min(1,volume));
      audio.playbackRate = rate;
      if(restart) audio.currentTime = 0;
      const p = audio.play();
      if(p && p.catch) p.catch(()=>{});
    }catch(e){}
  }

  function stopSfx(audio){
    if(!audio) return;
    try{
      audio.pause();
      audio.currentTime = 0;
    }catch(e){}
  }

  function startMachineGlow(){
    machine.classList.add("active-glow");
    scanLight.classList.add("go");
  }

  function stopMachineGlow(){
    machine.classList.remove("active-glow");
    scanLight.classList.remove("go");
  }

  function metrics(){
    const gapX = 0;
    const gapY = 0;
    const width = grid.clientWidth / 4;
    const height = grid.clientHeight / 4;
    return {gapX, gapY, width, height};
  }

  function slotPosition(slot){
    const m = metrics();
    return {
      x:(slot % 4) * m.width,
      y:Math.floor(slot / 4) * m.height,
      width:m.width,
      height:m.height
    };
  }

  function placeUnit(unit, slot, animate = true){
    const p = slotPosition(slot);
    if(!animate){ unit.style.transition = "none"; }
    unit.style.width = p.width + "px";
    unit.style.height = p.height + "px";
    unit.style.transform = `translate3d(${p.x}px,${p.y}px,0)`;
    unit.dataset.slot = slot;
    if(!animate){ unit.offsetHeight; unit.style.transition = ""; }
  }

  function buildGrid(){
    grid.innerHTML = "";
    units = [];
    const goldIndex = Math.floor(Math.random() * 16);
    for(let i=0;i<16;i++){
      const isGold = i === goldIndex;
      const unit = document.createElement("div");
      unit.className = isGold ? "unit gold-unit" : "unit";
      unit.dataset.id = i;
      unit.dataset.gold = isGold ? "1" : "0";
      unit.innerHTML = `
        <img class="unit-cube" src="cube.png" alt="">
        <img class="unit-capsule" src="${isGold ? "capsule-gold.png" : "capsule.png"}" alt="">
      `;
      grid.appendChild(unit);
      units.push(unit);
      placeUnit(unit, i, false);
      if(isGold) goldUnit = unit;
    }
  }

  const unitAt = slot => units.find(unit => Number(unit.dataset.slot) === slot);

  function neighbours(slot){
    const row = Math.floor(slot / 4);
    const column = slot % 4;
    const result = [];
    if(row > 0) result.push(slot - 4);
    if(row < 3) result.push(slot + 4);
    if(column > 0) result.push(slot - 1);
    if(column < 3) result.push(slot + 1);
    return result;
  }

  async function moveGroup(slots){
    const uniqueSlots = [...new Set(slots)];
    const group = uniqueSlots.map(slot => unitAt(slot));
    if(group.some(unit => !unit)) return;
    group.forEach(unit => unit.classList.add("moving"));
    const destinations = uniqueSlots.slice(1);
    destinations.push(uniqueSlots[0]);
    group.forEach((unit,index) => placeUnit(unit, destinations[index], true));
    await sleep(570);
    group.forEach(unit => unit.classList.remove("moving"));
  }

  function makeConnectedGroup(){
    const count = Math.random() < .52 ? 2 : 3;
    const first = Math.floor(Math.random() * 16);
    const slots = [first];
    let current = first;
    while(slots.length < count){
      const candidates = neighbours(current).filter(slot => !slots.includes(slot));
      if(candidates.length === 0) break;
      const next = candidates[Math.floor(Math.random() * candidates.length)];
      slots.push(next);
      current = next;
    }
    return slots;
  }

  async function shuffle(){
    for(let i=0;i<8;i++){
      await moveGroup(makeConnectedGroup());
      await sleep(70);
    }
  }

  async function selectTarget(isJackpot){
    let target;
    if(isJackpot){
      target = goldUnit;
    }else{
      const normalUnits = units.filter(unit => unit.dataset.gold !== "1");
      target = normalUnits[Math.floor(Math.random() * normalUnits.length)];
    }
    const decoys = [...units].filter(unit => unit !== target).sort(() => Math.random() - .5).slice(0,2);
    decoys.forEach(unit => unit.classList.add("selected"));
    await sleep(200);
    decoys.forEach(unit => unit.classList.remove("selected"));
    target.classList.add("selected");
    await sleep(320);
    return target;
  }

  async function routeToExit(target){
    let slot = Number(target.dataset.slot);
    while(Math.floor(slot / 4) < 3){
      const next = slot + 4;
      const extraCandidates = neighbours(next).filter(s => s !== slot);
      await moveGroup(extraCandidates.length ? [slot, next, extraCandidates[0]] : [slot, next]);
      slot = Number(target.dataset.slot);
    }
    while((slot % 4) > 1){
      const next = slot - 1;
      const extraCandidates = neighbours(next).filter(s => s !== slot);
      await moveGroup(extraCandidates.length ? [slot, next, extraCandidates[0]] : [slot, next]);
      slot = Number(target.dataset.slot);
    }
    while((slot % 4) < 1){
      const next = slot + 1;
      const extraCandidates = neighbours(next).filter(s => s !== slot);
      await moveGroup(extraCandidates.length ? [slot, next, extraCandidates[0]] : [slot, next]);
      slot = Number(target.dataset.slot);
    }
    target.classList.add("selected");
    await sleep(260);
  }

  async function jackpotEffect(target){
    units.forEach(unit => { if(unit !== target){ unit.classList.add("dim"); } });
    target.classList.remove("selected");
    target.classList.add("jackpot");
    await sleep(520);
  }

  async function sinkUnit(target){
    const slot = Number(target.dataset.slot);
    const p = slotPosition(slot);
    target.classList.remove("selected");
    target.classList.add("sink");
    target.style.transform = `translate3d(${p.x}px,${p.y + p.height * .95}px,0) scale(.58)`;
    await sleep(680);
  }

  async function releaseCapsule(isJackpot){
    outCapsule.src = isJackpot ? "capsule-gold.png" : "capsule.png";
    chute.classList.remove("active");
    outCapsule.classList.remove("show");
    void outCapsule.offsetWidth;
    chute.classList.add("active");
    outCapsule.classList.add("show");
    if(navigator.vibrate){ navigator.vibrate([18,35,22]); }
    await sleep(1040);
  }

  async function openCapsule(isJackpot){
    const src = isJackpot ? "capsule-gold.png" : "capsule.png";
    openTop.src = src;
    openBottom.src = src;
    openLayer.className = isJackpot ? "open-layer show gold" : "open-layer show";
    await sleep(110);
    openLayer.classList.add("opening");
    await sleep(760);
  }

  function fireFlash(element){
    element.classList.remove("go");
    void element.offsetWidth;
    element.classList.add("go");
  }

  async function run(){
    if(busy) return;
    busy = true;
    actionButton.disabled = true;

    startMachineGlow();
    playSfx(sfxMachine,1.0,true,1.0);

    buildGrid();
    outCapsule.classList.remove("show");
    chute.classList.remove("active");
    openLayer.className = "open-layer";
    await sleep(100);
    await shuffle();
    const isJackpot =
      mode === "jackpot"
      ||
      (
        mode !== "normal"
        &&
        Math.random() < .08
      );
    const target = await selectTarget(isJackpot);
    await routeToExit(target);
    if(isJackpot){
      playSfx(sfxJackpot,1.0,true,1.0);
      await jackpotEffect(target);
    }
    await sleep(140);
    await sinkUnit(target);
    await sleep(160);
    await releaseCapsule(isJackpot);
    await sleep(140);
    playSfx(sfxRiser,isJackpot ? 1.0 : .95,true,isJackpot ? 1.0 : 1.05);
    await openCapsule(isJackpot);
    playSfx(sfxImpact,1.0,true,isJackpot ? .94 : 1.0);

    if(isJackpot){
      fireFlash(goldFlash);
    }else{
      fireFlash(whiteFlash);
    }
    await sleep(isJackpot ? 1050 : 900);
    openLayer.className = "open-layer";

    stopSfx(sfxMachine);
    stopMachineGlow();

    busy = false;
    actionButton.disabled = false;
  }

  actionButton.addEventListener("pointerdown", () => {
    if(busy) return;

    playSfx(sfxButton,1.0,true,1.0);

    buttonArea.classList.add("pressed");

    if(navigator.vibrate){
      navigator.vibrate(14);
    }
  });
  ["pointerup","pointercancel","pointerleave"].forEach(eventName => {
    actionButton.addEventListener(eventName, () => { buttonArea.classList.remove("pressed"); });
  });
  actionButton.addEventListener("click", run);

  window.addEventListener("resize", () => { if(!busy) buildGrid(); });
  buildGrid();
})();
</script>


</body>
</html>
