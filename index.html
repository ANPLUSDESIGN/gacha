<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pixel Cube Gacha V5</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#02050b}
body{
  min-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.stage{width:min(100vw,500px);height:100svh;display:flex;align-items:center;justify-content:center}
.machine{
  position:relative;width:min(100%,calc(100svh * .5628));aspect-ratio:941/1672;
  filter:drop-shadow(0 22px 42px rgba(0,0,0,.52));
}
.machine-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none}

/* 元画像の4×4は正方形。高さを%固定にせず、幅から正方形を作る */
.grid{
  position:absolute;left:12.8%;top:10.9%;width:74.3%;aspect-ratio:1/1;z-index:5;
}

/* 外周の角丸フレームは元画像のまま固定。
   動かすのは各セル内部の「カプセル」だけ。 */
.slot{
  position:absolute;width:25%;height:25%;pointer-events:none;
}
.slot-mask{
  position:absolute;inset:7%;
  border-radius:7%;
  background:rgba(3,12,24,.28);
  backdrop-filter:blur(2px) brightness(.62) saturate(.70);
  -webkit-backdrop-filter:blur(2px) brightness(.62) saturate(.70);
  box-shadow:inset 0 0 14px rgba(26,129,220,.08);
}

/* 元画像から切り出した実写カプセル */
.photo-cap{
  position:absolute;left:0;top:0;width:17.2%;aspect-ratio:1/1;border-radius:50%;
  background-repeat:no-repeat;
  transform:translate3d(0,0,0) scale(1);
  transition:
    transform .31s cubic-bezier(.18,.83,.23,1.06),
    filter .20s ease,
    opacity .20s ease,
    box-shadow .20s ease;
  will-change:transform;
  z-index:10;
  filter:drop-shadow(0 4px 7px rgba(0,0,0,.42));
}
.photo-cap.moving{
  z-index:24;
  filter:brightness(1.18) drop-shadow(0 0 12px rgba(56,196,255,.65));
  transform:translate3d(var(--x),var(--y),0) scale(1.08) rotate(5deg);
}
.photo-cap.selected{
  z-index:28;
  filter:brightness(1.33) drop-shadow(0 0 12px #7feaff) drop-shadow(0 0 24px #169cff);
}
.photo-cap.dim{opacity:.35;filter:brightness(.55) saturate(.55)}
.photo-cap.gold{
  z-index:30;
  filter:brightness(1.2) drop-shadow(0 0 12px #fff0a0) drop-shadow(0 0 28px #ffad00);
  animation:goldBreath .55s ease-in-out infinite alternate;
}
@keyframes goldBreath{to{filter:brightness(1.55) drop-shadow(0 0 18px #fff1a5) drop-shadow(0 0 38px #ffad00)}}

/* 選択セルの控えめな枠 */
.selection-ring{
  position:absolute;inset:4%;border-radius:8%;opacity:0;pointer-events:none;z-index:22;
  box-shadow:inset 0 0 0 2px rgba(169,241,255,.95),0 0 18px rgba(41,185,255,.78);
  transition:opacity .16s ease;
}
.slot.on .selection-ring{opacity:1}
.slot.gold-on .selection-ring{
  opacity:1;
  box-shadow:inset 0 0 0 2px #fff0a1,0 0 24px #ffb000;
}

/* ボタン位置。追加の青リングは一切描かない */
.push{
  position:absolute;left:50%;top:60.75%;width:19.2%;aspect-ratio:1/1;
  transform:translate(-50%,-50%);border:0;border-radius:50%;background:transparent;z-index:50;cursor:pointer;
}
.push::after{
  content:"";position:absolute;inset:11%;border-radius:50%;opacity:0;
  background:rgba(0,8,22,.15);
  box-shadow:inset 0 8px 18px rgba(0,0,0,.52);
  transition:opacity .07s ease,transform .07s ease;
}
.push.pressed::after{opacity:1;transform:translateY(3px) scale(.96)}
.push:disabled{pointer-events:none}

/* 排出口 */
.chute{
  position:absolute;left:37.0%;top:70.8%;width:26.0%;height:13.7%;z-index:45;
  overflow:hidden;pointer-events:none;
}
.chute-glow{
  position:absolute;left:12%;right:12%;top:4%;height:18%;border-radius:50%;
  opacity:0;background:radial-gradient(ellipse,rgba(85,205,255,.85),rgba(33,125,255,.16) 50%,transparent 72%);
}
.chute.active .chute-glow{animation:chuteGlow .8s ease}
@keyframes chuteGlow{0%{opacity:0}28%{opacity:1}100%{opacity:0}}

/* 排出口から出る実写カプセル。元画像のカプセルをそのまま切り出して使用 */
.out-cap{
  position:absolute;left:50%;top:-36%;width:53%;aspect-ratio:1/1;border-radius:50%;
  transform:translate(-50%,-50%) scale(.70) rotate(-10deg);
  opacity:0;background-repeat:no-repeat;
  filter:drop-shadow(0 7px 8px rgba(0,0,0,.55));
}
.out-cap.show{animation:out .90s cubic-bezier(.16,.84,.23,1.15) forwards}
@keyframes out{
  0%{top:-34%;opacity:0;transform:translate(-50%,-50%) scale(.68) rotate(-12deg)}
  16%{opacity:1}
  58%{top:53%;opacity:1;transform:translate(-50%,-50%) scale(.92) rotate(8deg)}
  80%{top:69%;transform:translate(-50%,-50%) scale(1.02) rotate(-3deg)}
  100%{top:64%;opacity:1;transform:translate(-50%,-50%) scale(.98) rotate(0)}
}

/* フラッシュ */
.flash,.gold-flash{position:fixed;inset:0;pointer-events:none;z-index:100;opacity:0}
.flash{background:#fff}
.flash.go{animation:whiteFlash .48s ease-out}
@keyframes whiteFlash{0%{opacity:0}20%{opacity:.88}100%{opacity:0}}
.gold-flash{
  background:radial-gradient(circle at 50% 45%,#fff 0 2%,#fff09a 7%,rgba(255,181,0,.62) 23%,transparent 55%);
}
.gold-flash.go{animation:goldFlash .88s ease-out}
@keyframes goldFlash{0%{opacity:0;transform:scale(.5)}28%{opacity:1}100%{opacity:0;transform:scale(1.4)}}

/* テスト用 */
.mode{
  position:fixed;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  display:flex;gap:6px;padding:6px;border-radius:999px;background:rgba(0,0,0,.74);
  border:1px solid rgba(255,255,255,.15);z-index:150;
}
.mode button{
  border:0;border-radius:999px;padding:8px 14px;background:#172033;color:white;font-size:12px;font-weight:800;
}
.mode button.active{background:#087cff}

.version{
  position:fixed;left:50%;bottom:7px;transform:translateX(-50%);z-index:160;
  color:#78dfff;background:rgba(0,0,0,.55);font-size:10px;padding:4px 8px;border-radius:999px;
}
</style>
</head>
<body>

<div class="stage">
  <div class="machine" id="machine">
    <img class="machine-img" id="machineImg" src="gacha-machine.png" alt="ガチャマシーン">

    <div class="grid" id="grid"></div>

    <button class="push" id="push" aria-label="ガチャを回す"></button>

    <div class="chute" id="chute">
      <div class="chute-glow"></div>
      <div class="out-cap" id="outCap"></div>
    </div>
  </div>
</div>

<div class="flash" id="flash"></div>
<div class="gold-flash" id="goldFlash"></div>

<div class="mode" id="mode">
  <button data-mode="normal">通常</button>
  <button data-mode="random" class="active">ランダム</button>
  <button data-mode="jackpot">確定</button>
</div>

<div class="version">V5 / 正方形・実写カプセル排出版</div>

<script>
const IMG = "gacha-machine.png";
const GRID = { left:.128, top:.109, width:.743 }; // 元画像の4×4領域
const GOLD_SOURCE = 5; // 元画像内の実写ゴールドカプセル

const machine = document.getElementById("machine");
const machineImg = document.getElementById("machineImg");
const grid = document.getElementById("grid");
const push = document.getElementById("push");
const chute = document.getElementById("chute");
const outCap = document.getElementById("outCap");
const flash = document.getElementById("flash");
const goldFlash = document.getElementById("goldFlash");
const modePanel = document.getElementById("mode");

let mode = "random";
let busy = false;
let caps = [];
let slots = [];
const sleep = ms => new Promise(r=>setTimeout(r,ms));

function slotPos(slot){
  const cell = grid.clientWidth / 4;
  const cap = cell * .69;
  const inset = (cell-cap)/2;
  return {
    x:(slot%4)*cell + inset,
    y:Math.floor(slot/4)*cell + inset,
    size:cap
  };
}

/* 元画像の指定セル中央から「カプセルだけ」を丸く切り出す */
function photoStyle(sourceIndex, element){
  const mw = machine.clientWidth;
  const mh = machine.clientHeight;
  const cell = grid.clientWidth/4;
  const row = Math.floor(sourceIndex/4);
  const col = sourceIndex%4;
  const size = cell*.69;

  /* 表示中の元画像座標 */
  const gridLeft = mw*GRID.left;
  const gridTop  = mh*GRID.top;
  const cropX = gridLeft + col*cell + cell*.155;
  const cropY = gridTop  + row*cell + cell*.155;

  element.style.backgroundImage=`url("${IMG}")`;
  element.style.backgroundSize=`${mw}px ${mh}px`;
  element.style.backgroundPosition=`-${cropX}px -${cropY}px`;
}

function placeCap(cap, slot, animate=true){
  const p=slotPos(slot);
  if(!animate) cap.style.transition="none";
  cap.style.width=p.size+"px";
  cap.style.height=p.size+"px";
  cap.style.transform=`translate3d(${p.x}px,${p.y}px,0) scale(1)`;
  cap.style.setProperty("--x",p.x+"px");
  cap.style.setProperty("--y",p.y+"px");
  cap.dataset.slot=slot;
  if(!animate){
    cap.offsetHeight;
    cap.style.transition="";
  }
}

function build(){
  grid.innerHTML="";
  slots=[];
  caps=[];

  for(let i=0;i<16;i++){
    const slot=document.createElement("div");
    slot.className="slot";
    slot.style.left=(i%4)*25+"%";
    slot.style.top=Math.floor(i/4)*25+"%";
    slot.innerHTML='<div class="slot-mask"></div><div class="selection-ring"></div>';
    grid.appendChild(slot);
    slots.push(slot);
  }

  for(let i=0;i<16;i++){
    const cap=document.createElement("div");
    cap.className="photo-cap";
    cap.dataset.source=i;
    photoStyle(i,cap);
    grid.appendChild(cap);
    caps.push(cap);
    placeCap(cap,i,false);
  }
}

function capAt(slot){
  return caps.find(c=>Number(c.dataset.slot)===slot);
}

function neighbours(slot){
  const r=Math.floor(slot/4),c=slot%4,n=[];
  if(r>0)n.push(slot-4);
  if(r<3)n.push(slot+4);
  if(c>0)n.push(slot-1);
  if(c<3)n.push(slot+1);
  return n;
}

async function swap(a,b){
  const ca=capAt(a),cb=capAt(b);
  if(!ca||!cb)return;

  ca.classList.add("moving");
  cb.classList.add("moving");

  placeCap(ca,b,true);
  placeCap(cb,a,true);

  await sleep(320);

  ca.classList.remove("moving");
  cb.classList.remove("moving");
}

async function shuffle(){
  let cur=Math.floor(Math.random()*16);
  for(let i=0;i<15;i++){
    const ns=neighbours(cur);
    const next=ns[Math.floor(Math.random()*ns.length)];
    await swap(cur,next);
    cur=next;
  }
}

function clearStates(){
  slots.forEach(s=>s.classList.remove("on","gold-on"));
  caps.forEach(c=>c.classList.remove("selected","dim","gold"));
}

async function choose(){
  clearStates();

  const target=caps[Math.floor(Math.random()*caps.length)];
  const decoys=[...caps].filter(c=>c!==target).sort(()=>Math.random()-.5).slice(0,2);

  for(const c of decoys){
    c.classList.add("selected");
    slots[Number(c.dataset.slot)].classList.add("on");
    await sleep(210);
    c.classList.remove("selected");
    slots[Number(c.dataset.slot)].classList.remove("on");
  }

  target.classList.add("selected");
  slots[Number(target.dataset.slot)].classList.add("on");
  await sleep(480);

  return target;
}

function fire(el){
  el.classList.remove("go");
  void el.offsetWidth;
  el.classList.add("go");
}

/* ゴールド確定時はCSSの絵を描かず、
   元画像に最初からある実写ゴールドカプセルの切り出しへ変更 */
async function jackpot(target){
  caps.forEach(c=>{if(c!==target)c.classList.add("dim")});

  await sleep(260);

  target.classList.remove("selected");
  target.classList.add("gold");
  slots[Number(target.dataset.slot)].classList.remove("on");
  slots[Number(target.dataset.slot)].classList.add("gold-on");

  photoStyle(GOLD_SOURCE,target);

  fire(goldFlash);
  await sleep(650);
}

function setOutPhoto(sourceIndex){
  const mw=machine.clientWidth;
  const mh=machine.clientHeight;
  const cell=grid.clientWidth/4;
  const row=Math.floor(sourceIndex/4);
  const col=sourceIndex%4;

  const gridLeft=mw*GRID.left;
  const gridTop=mh*GRID.top;
  const cropX=gridLeft + col*cell + cell*.155;
  const cropY=gridTop  + row*cell + cell*.155;

  outCap.style.backgroundImage=`url("${IMG}")`;
  outCap.style.backgroundSize=`${mw}px ${mh}px`;
  outCap.style.backgroundPosition=`-${cropX}px -${cropY}px`;
}

/* カプセルはボタンへ飛ばさない。
   選択セルで消えて、機械内部を通った扱いにし、
   直接「排出口の奥」から実写カプセルが出る。 */
async function release(target,isJackpot){
  const source=isJackpot ? GOLD_SOURCE : Number(target.dataset.source);

  target.animate(
    [
      {transform:target.style.transform,opacity:1,filter:"brightness(1.3)"},
      {transform:target.style.transform+" scale(.72)",opacity:0,filter:"brightness(2)"}
    ],
    {duration:360,easing:"ease-in",fill:"forwards"}
  );

  await sleep(430);

  setOutPhoto(source);

  outCap.className="out-cap";
  chute.classList.remove("active");
  void outCap.offsetWidth;

  chute.classList.add("active");
  outCap.classList.add("show");

  if(navigator.vibrate) navigator.vibrate([18,35,22]);

  await sleep(950);
}

async function run(){
  if(busy)return;
  busy=true;
  push.disabled=true;

  outCap.className="out-cap";
  outCap.style.backgroundImage="";
  chute.classList.remove("active");
  clearStates();

  await shuffle();
  const target=await choose();

  const isJackpot =
    mode==="jackpot" ||
    (mode==="random" && Math.random()<.08);

  if(isJackpot) await jackpot(target);

  await sleep(220);
  await release(target,isJackpot);

  fire(isJackpot?goldFlash:flash);

  await sleep(360);

  /* 次回用に元の実写切り出しを復元 */
  caps.forEach(c=>{
    c.getAnimations().forEach(a=>a.cancel());
    c.style.opacity="";
    c.style.filter="";
    photoStyle(Number(c.dataset.source),c);
  });
  clearStates();

  push.disabled=false;
  busy=false;
}

push.addEventListener("pointerdown",()=>{
  if(busy)return;
  push.classList.add("pressed");
  if(navigator.vibrate) navigator.vibrate(14);
});
["pointerup","pointercancel","pointerleave"].forEach(ev=>{
  push.addEventListener(ev,()=>push.classList.remove("pressed"));
});
push.addEventListener("click",run);

modePanel.addEventListener("click",e=>{
  const b=e.target.closest("button");
  if(!b)return;
  mode=b.dataset.mode;
  modePanel.querySelectorAll("button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
});

function init(){
  build();
}
if(machineImg.complete) setTimeout(init,80);
else machineImg.addEventListener("load",init);

window.addEventListener("resize",()=>{
  if(!busy) build();
});
</script>
</body>
</html>
