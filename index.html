<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pixel Cube Gacha V3</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  background:#02050b;
  color:#fff;
  font-family:system-ui,-apple-system,sans-serif;
}

body{
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.wrap{
  width:min(100vw,500px);
  height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.machine{
  position:relative;
  width:min(100%,calc(100svh * .5));
  aspect-ratio:1/2;
}

.machine > img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}


/* =========================
   4×4 キューブエリア
========================= */

.grid{
  position:absolute;

  left:11.4%;
  top:10.2%;

  width:77.2%;
  height:42.9%;

  border-radius:3%;
  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      #06111f 0%,
      #020813 100%
    );

  box-shadow:
    inset 0 0 0 1px rgba(160,230,255,.25),
    inset 0 0 28px rgba(0,140,255,.18);

  z-index:3;
}


/* =========================
   1キューブ
========================= */

.cube{
  position:absolute;

  border-radius:10%;

  border:
    1px solid rgba(190,235,255,.5);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.15),
      rgba(55,125,190,.05)
    );

  box-shadow:
    inset 0 0 15px rgba(60,190,255,.12),
    0 0 8px rgba(50,160,255,.14);

  transition:
    transform .28s cubic-bezier(.18,.82,.2,1.08),
    filter .18s,
    box-shadow .18s,
    opacity .18s;

  will-change:transform;
}


/* 移動中 */

.cube.moving{
  z-index:10;

  filter:brightness(1.55);

  box-shadow:
    0 0 28px rgba(40,190,255,.65),
    inset 0 0 22px rgba(60,210,255,.2);
}


/* 選択されたキューブ */

.cube.selected{
  z-index:12;

  filter:brightness(1.45);

  box-shadow:
    0 0 34px #26c8ff,
    inset 0 0 0 2px #baf4ff;
}


/* 確定演出時の周囲 */

.cube.dim{
  opacity:.28;
  filter:brightness(.55);
}


/* ゴールド確定 */

.cube.goldCube{
  z-index:14;

  box-shadow:
    0 0 50px #ffb300,
    inset 0 0 0 2px #fff0a0,
    inset 0 0 30px rgba(255,190,0,.5);
}


/* =========================
   カプセル
========================= */

.cap{
  position:absolute;

  left:50%;
  top:50%;

  width:72%;
  aspect-ratio:1;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  filter:
    drop-shadow(
      0 5px 5px rgba(0,0,0,.45)
    );
}

.capTop,
.capBottom{
  position:absolute;

  left:7%;

  width:86%;
  height:42%;

  border:
    1.4px solid rgba(255,255,255,.65);

  box-shadow:
    inset 0 0 10px rgba(255,255,255,.2);
}

.capTop{
  top:7%;

  border-radius:
    999px 999px 12px 12px;
}

.capBottom{
  bottom:7%;

  border-radius:
    12px 12px 999px 999px;
}

.capBand{
  position:absolute;

  left:6%;
  right:6%;

  top:46%;

  height:8%;

  border-radius:999px;

  background:
    rgba(255,255,255,.55);
}


/* ゴールドカプセル */

.cap.gold{
  filter:
    drop-shadow(0 0 10px #ffe35c)
    drop-shadow(0 0 20px #ffad00);
}

.cap.gold .capTop,
.cap.gold .capBottom{

  background:
    linear-gradient(
      135deg,
      #fff4a6,
      #ffd33c 30%,
      #9b5b00 66%,
      #fff0a0
    ) !important;

  border-color:#fff1a0;
}

.cap.gold .capBand{

  background:
    linear-gradient(
      90deg,
      #fff5b2,
      #c47b00,
      #fff3aa
    );
}


/* =========================
   ガチャボタン
========================= */

.start{

  position:absolute;

  left:50%;
  top:61.25%;

  transform:
    translate(-50%,-50%);

  width:19%;
  aspect-ratio:1;

  border:0;
  border-radius:50%;

  background:transparent;

  z-index:8;

  cursor:pointer;
}

.start::after{

  content:"";

  position:absolute;

  inset:10%;

  border-radius:50%;

  box-shadow:
    0 0 0 3px rgba(90,225,255,.8),
    0 0 30px rgba(30,170,255,.8);

  animation:
    buttonPulse 1s infinite alternate;
}

@keyframes buttonPulse{

  to{

    box-shadow:
      0 0 0 5px rgba(130,240,255,1),
      0 0 44px rgba(40,180,255,1);

  }

}


/* =========================
   排出カプセル
========================= */

.fly{

  position:absolute;

  left:50%;
  top:35%;

  width:14%;
  aspect-ratio:1;

  transform:
    translate(-50%,-50%);

  opacity:0;

  z-index:15;
}

.fly .cap{
  width:100%;
}

.fly.go{

  opacity:1;

  animation:
    capsuleFall
    1.15s
    cubic-bezier(.2,.8,.25,1)
    forwards;
}

@keyframes capsuleFall{

  0%{

    top:35%;

    transform:
      translate(-50%,-50%)
      scale(.8)
      rotate(-10deg);

  }

  40%{

    top:48%;

    transform:
      translate(-50%,-50%)
      scale(.94)
      rotate(8deg);

  }

  72%{

    top:62%;

    transform:
      translate(-50%,-50%)
      scale(1)
      rotate(-5deg);

  }

  100%{

    top:77%;

    transform:
      translate(-50%,-50%)
      scale(.92)
      rotate(0);

  }

}


/* =========================
   テストボタン
========================= */

.panel{

  position:fixed;

  top:max(
    8px,
    env(safe-area-inset-top)
  );

  left:50%;

  transform:
    translateX(-50%);

  z-index:50;

  display:flex;

  gap:6px;

  background:
    rgba(0,0,0,.65);

  border:
    1px solid rgba(255,255,255,.15);

  border-radius:999px;

  padding:6px;
}

.panel button{

  border:0;

  border-radius:999px;

  background:#172033;

  color:#fff;

  padding:
    7px 11px;

  font-weight:800;

  font-size:11px;
}

.panel button.active{
  background:#087cff;
}


/* =========================
   V3表示
========================= */

.version{

  position:fixed;

  bottom:8px;

  left:50%;

  transform:
    translateX(-50%);

  z-index:60;

  font-size:10px;

  color:#79dfff;

  background:
    rgba(0,0,0,.55);

  padding:
    4px 8px;

  border-radius:999px;
}


/* =========================
   フラッシュ
========================= */

.flash{

  position:fixed;

  inset:0;

  background:#fff;

  opacity:0;

  pointer-events:none;

  z-index:30;
}

.flash.go{

  animation:
    flashAnim .5s ease-out;
}

@keyframes flashAnim{

  0%{
    opacity:0;
  }

  20%{
    opacity:.95;
  }

  100%{
    opacity:0;
  }

}


/* ゴールド */

.goldflash{

  position:fixed;

  inset:0;

  opacity:0;

  pointer-events:none;

  z-index:31;

  background:

    radial-gradient(
      circle at center,

      #fff 0 2%,

      #ffe878 7%,

      rgba(255,180,0,.75) 22%,

      transparent 52%
    );
}

.goldflash.go{

  animation:
    goldAnim .9s ease-out;
}

@keyframes goldAnim{

  0%{

    opacity:0;

    transform:
      scale(.45);

  }

  30%{

    opacity:1;

  }

  100%{

    opacity:0;

    transform:
      scale(1.4);

  }

}

</style>
</head>


<body>


<div class="wrap">

  <div class="machine">

    <img
      src="gacha-machine.png"
      alt="ガチャマシーン"
    >


    <div
      class="grid"
      id="grid">
    </div>


    <button
      class="start"
      id="start">
    </button>


    <div
      class="fly"
      id="fly">
    </div>


  </div>

</div>


<div
  class="panel"
  id="panel">

  <button
    data-mode="normal">
    通常
  </button>

  <button
    data-mode="random"
    class="active">
    ランダム
  </button>

  <button
    data-mode="jackpot">
    確定
  </button>

</div>


<div class="version">
V3 / キューブ実移動版
</div>


<div
  class="flash"
  id="flash">
</div>


<div
  class="goldflash"
  id="goldflash">
</div>



<script>

/* =========================
   カプセルカラー
========================= */

const colors = [

  ["#ff405f","#980017"],

  ["#3197ff","#003f9b"],

  ["#31df8a","#00683a"],

  ["#b85cff","#5a1290"],

  ["#2fd9f5","#00778e"],

  ["#ffc943","#9e5a00"],

  ["#ff63c4","#991765"],

  ["#ff7930","#9f3100"],

  ["#a25dff","#531590"],

  ["#298aff","#003a91"],

  ["#ff4141","#8f0000"],

  ["#3dd5ef","#00768d"],

  ["#e9ca48","#938000"],

  ["#34d877","#00723a"],

  ["#d785ff","#7833a0"],

  ["#3194ff","#004297"]

];



const grid =
document.getElementById("grid");

const start =
document.getElementById("start");

const fly =
document.getElementById("fly");

const flash =
document.getElementById("flash");

const goldflash =
document.getElementById("goldflash");

const panel =
document.getElementById("panel");


let mode = "random";

let cubes = [];

let busy = false;


const sleep = ms =>
new Promise(
  resolve =>
  setTimeout(resolve,ms)
);



/* =========================
   カプセルHTML
========================= */

function capHTML(
  pair,
  gold = false
){

  const [a,b] = pair;


  return `

  <div class="cap ${gold ? "gold" : ""}">

    <div
      class="capTop"
      style="
      background:
      linear-gradient(
      145deg,
      ${a},
      ${b}
      );
      ">
    </div>


    <div
      class="capBottom"
      style="
      background:
      linear-gradient(
      145deg,
      ${b},
      ${a}
      );
      ">
    </div>


    <div
      class="capBand">
    </div>

  </div>

  `;

}



/* =========================
   キューブサイズ計算
========================= */

function metrics(){

  const r =
  grid.getBoundingClientRect();


  const gap =
  r.width * .018;


  const cellW =
  (r.width - gap * 3) / 4;


  const cellH =
  (r.height - gap * 3) / 4;


  return {

    gap,

    cellW,

    cellH

  };

}



/* =========================
   0〜15の位置を座標に変換
========================= */

function xy(slot){

  const {

    gap,

    cellW,

    cellH

  } = metrics();


  const row =
  Math.floor(slot / 4);


  const col =
  slot % 4;


  return {

    x:
    col *
    (cellW + gap),

    y:
    row *
    (cellH + gap),

    w:
    cellW,

    h:
    cellH

  };

}



/* =========================
   キューブを配置
========================= */

function place(
  cube,
  slot,
  animate = true
){

  const p =
  xy(slot);


  cube.style.width =
  p.w + "px";


  cube.style.height =
  p.h + "px";


  if(!animate){

    cube.style.transition =
    "none";

  }


  cube.style.transform =

  `translate3d(
  ${p.x}px,
  ${p.y}px,
  0
  )`;


  cube.dataset.slot =
  slot;


  if(!animate){

    cube.offsetHeight;

    cube.style.transition =
    "";

  }

}



/* =========================
   16キューブ生成
========================= */

function build(){

  grid.innerHTML = "";

  cubes = [];


  for(
    let i = 0;
    i < 16;
    i++
  ){

    const cube =
    document.createElement("div");


    cube.className =
    "cube";


    cube.dataset.color =
    i;


    cube.innerHTML =
    capHTML(
      colors[i]
    );


    grid.appendChild(
      cube
    );


    cubes.push(
      cube
    );

  }


  requestAnimationFrame(
    () => {

      cubes.forEach(
        (cube,i) => {

          place(
            cube,
            i,
            false
          );

        }
      );

    }
  );

}


build();



/* =========================
   スマホ回転対応
========================= */

window.addEventListener(
  "resize",

  () => {

    cubes.forEach(
      cube => {

        place(
          cube,
          Number(
            cube.dataset.slot
          ),
          false
        );

      }
    );

  }
);



/* =========================
   指定マスのキューブ取得
========================= */

function cubeAt(slot){

  return cubes.find(
    cube =>
    Number(
      cube.dataset.slot
    ) === slot
  );

}



/* =========================
   隣接マス取得
========================= */

function neighbors(slot){

  const row =
  Math.floor(slot / 4);

  const col =
  slot % 4;


  const list = [];


  if(row > 0){
    list.push(
      slot - 4
    );
  }


  if(row < 3){
    list.push(
      slot + 4
    );
  }


  if(col > 0){
    list.push(
      slot - 1
    );
  }


  if(col < 3){
    list.push(
      slot + 1
    );
  }


  return list;

}



/* =========================
   2つのキューブを入れ替える
========================= */

async function swap(
  slotA,
  slotB
){

  const cubeA =
  cubeAt(slotA);


  const cubeB =
  cubeAt(slotB);


  if(
    !cubeA ||
    !cubeB
  ){
    return;
  }


  cubeA.classList.add(
    "moving"
  );


  cubeB.classList.add(
    "moving"
  );


  place(
    cubeA,
    slotB,
    true
  );


  place(
    cubeB,
    slotA,
    true
  );


  await sleep(300);


  cubeA.classList.remove(
    "moving"
  );


  cubeB.classList.remove(
    "moving"
  );

}



/* =========================
   キューブシャッフル
========================= */

async function shuffle(){

  let current =
  Math.floor(
    Math.random() * 16
  );


  for(
    let i = 0;
    i < 18;
    i++
  ){

    const near =
    neighbors(
      current
    );


    const next =

    near[
      Math.floor(
        Math.random() *
        near.length
      )
    ];


    await swap(
      current,
      next
    );


    current =
    next;

  }

}



/* =========================
   状態リセット
========================= */

function clear(){

  cubes.forEach(
    cube => {

      cube.classList.remove(
        "selected",
        "goldCube",
        "dim",
        "moving"
      );

    }
  );

}



/* =========================
   当選キューブ選択
========================= */

async function choose(){

  clear();


  const target =

  cubes[
    Math.floor(
      Math.random() *
      cubes.length
    )
  ];


  const others =

  [...cubes]

  .filter(
    cube =>
    cube !== target
  )

  .sort(
    () =>
    Math.random() - .5
  )

  .slice(
    0,
    2
  );


  for(
    const cube of others
  ){

    cube.classList.add(
      "selected"
    );


    await sleep(220);


    cube.classList.remove(
      "selected"
    );

  }


  target.classList.add(
    "selected"
  );


  await sleep(450);


  return target;

}



/* =========================
   フラッシュ
========================= */

function doFlash(
  gold = false
){

  const el =
  gold
  ? goldflash
  : flash;


  el.classList.remove(
    "go"
  );


  void el.offsetWidth;


  el.classList.add(
    "go"
  );

}



/* =========================
   ガチャ実行
========================= */

async function run(){

  if(busy){
    return;
  }


  busy = true;


  start.disabled =
  true;


  fly.className =
  "fly";


  clear();



  /* -------------------------
     キューブシャッフル
  ------------------------- */

  await shuffle();



  /* -------------------------
     キューブ選択
  ------------------------- */

  const target =
  await choose();



  /* -------------------------
     大当たり判定
  ------------------------- */

  const jackpot =

  mode === "jackpot"

  ||

  (
    mode === "random"

    &&

    Math.random() < .08
  );



  /* -------------------------
     確定演出
  ------------------------- */

  if(jackpot){

    cubes.forEach(
      cube => {

        if(
          cube !== target
        ){

          cube.classList.add(
            "dim"
          );

        }

      }
    );


    await sleep(250);


    target.classList.remove(
      "selected"
    );


    target.classList.add(
      "goldCube"
    );


    target.innerHTML =

    capHTML(

      colors[
        Number(
          target.dataset.color
        )
      ],

      true

    );


    doFlash(true);


    await sleep(520);

  }



  /* -------------------------
     カプセル排出
  ------------------------- */

  fly.innerHTML =

  capHTML(

    colors[
      Number(
        target.dataset.color
      )
    ],

    jackpot

  );


  const targetCap =

  target.querySelector(
    ".cap"
  );


  if(targetCap){

    targetCap.style.opacity =
    "0";

  }


  void fly.offsetWidth;


  fly.classList.add(
    "go"
  );


  await sleep(1200);



  /* -------------------------
     結果フラッシュ
  ------------------------- */

  doFlash(
    jackpot
  );


  await sleep(350);



  /* -------------------------
     次回用に戻す
  ------------------------- */

  cubes.forEach(
    cube => {

      cube.classList.remove(
        "selected",
        "goldCube",
        "dim"
      );


      cube.innerHTML =

      capHTML(

        colors[
          Number(
            cube.dataset.color
          )
        ],

        false

      );

    }
  );


  fly.className =
  "fly";


  busy = false;


  start.disabled =
  false;

}



/* =========================
   中央ボタン
========================= */

start.addEventListener(
  "click",
  run
);



/* =========================
   通常 / ランダム / 確定
========================= */

panel.addEventListener(
  "click",
  event => {

    const button =

    event.target.closest(
      "button"
    );


    if(!button){
      return;
    }


    mode =
    button.dataset.mode;


    panel
    .querySelectorAll(
      "button"
    )
    .forEach(
      item => {

        item.classList.remove(
          "active"
        );

      }
    );


    button.classList.add(
      "active"
    );

  }
);

</script>

</body>
</html>
